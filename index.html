<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chat-to-Comment (@websim)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="styles.css" />

    <script type="importmap">
      {
        "imports": {
          "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
          "dompurify": "https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.min.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="app">
      <header class="bar">
        <div class="title">Chat → Comment</div>
        <div id="userBadge" class="user"></div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer" autocomplete="off">
        <div class="inputWrap">
          <textarea id="input" rows="3" placeholder="Type to ask @websim… (Enter to send, Shift+Enter for new line)"></textarea>
          <div class="previewLabel">Will suggest this as a comment:</div>
          <div id="preview" class="preview"></div>
        </div>
        <div class="actions">
          <button id="send" type="submit" class="btn">Send</button>
        </div>
      </form>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
